<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario integratori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--ink:#16202B;--muted:#5C6978;--line:#D5DBE3;
  --prima:#2F5BFF;--prima-soft:#E3E9FF;--dopo:#0E8A6B;--dopo-soft:#DDF3EC;--danger:#C0392B;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171E;--surface:#1B222B;--ink:#EAEFF5;--muted:#9AA7B6;--line:#2C3642;
    --prima:#7B9BFF;--prima-soft:#233056;--dopo:#4FD1A5;--dopo-soft:#17382F;--danger:#FF7B6B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171E;--surface:#1B222B;--ink:#EAEFF5;--muted:#9AA7B6;--line:#2C3642;
  --prima:#7B9BFF;--prima-soft:#233056;--dopo:#4FD1A5;--dopo-soft:#17382F;--danger:#FF7B6B;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 40px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:8px 0 4px;letter-spacing:.01em}
h2{font:700 24px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 12px}
.date{color:var(--muted);margin:0 0 20px;text-transform:capitalize}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg button{font:600 18px "Barlow",sans-serif;padding:14px 8px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"].p{background:var(--prima-soft);border-color:var(--prima);color:var(--prima)}
.seg button[aria-pressed="true"].d{background:var(--dopo-soft);border-color:var(--dopo);color:var(--dopo)}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 16px "Barlow",sans-serif;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip:active{transform:scale(.97)}
.chip .x{color:var(--danger);font-weight:700}
input[type=text],select{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:8px}
.btn{font:600 16px "Barlow",sans-serif;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.link{background:none;border:0;color:var(--muted);font:500 14px "Barlow",sans-serif;text-decoration:underline;cursor:pointer;padding:4px 0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--prima);outline-offset:2px}
.toast{min-height:22px;color:var(--dopo);font-weight:500;margin:6px 0 0}
.grp{margin:0 0 14px}.grp:last-child{margin:0}
.grp h3{font:600 15px "Barlow",sans-serif;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
li small{color:var(--muted)}
li button{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px}
.empty{color:var(--muted);font-size:15px;margin:0}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:600}
.st{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0;padding-top:0}
a.wa{font:600 15px "Barlow",sans-serif;padding:9px 12px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;text-align:center}
a.wa.low{background:var(--dopo);border-color:var(--dopo);color:var(--surface)}
@media (prefers-reduced-motion:reduce){.chip:active{transform:none}}
.brand{text-align:center;margin:4px 0 18px}
.brand img{display:block;width:100%;max-width:280px;height:auto;margin:0 auto;border-radius:16px}
</style>
</head>

    <p class="hint">Tocca un prodotto per segnarlo.</p>
    <div class="chips" id="chips"></div>
    <input type="text" id="dose" placeholder="Dose (facoltativa), es. 5 g" aria-label="Dose">
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="row">
      <input type="text" id="newp" placeholder="Nuovo prodotto" aria-label="Nuovo prodotto">
      <button class="btn" id="addp">Aggiungi</button>
    </div>
    <button class="link" id="edit">Modifica prodotti</button>
  </section>

  <section>
    <h2>La tua scorta</h2>
    <p class="hint">Indica quanto prodotto hai e quanto ne usi al giorno: l’app ti dice quando sta per finire.</p>
    <div id="stock"></div>
    <div class="row"><select id="sp" aria-label="Prodotto"></select></div>
    <div class="row">
      <input type="text" inputmode="decimal" id="sq" placeholder="Quanti g hai" aria-label="Quantità in grammi">
      <input type="text" inputmode="decimal" id="sd" placeholder="g al giorno" aria-label="Dose al giorno in grammi">
    </div>
    <div class="row"><button class="btn" id="ss">Salva scorta</button></div>
  </section>

  <section>
    <h2>Oggi</h2>
    <div class="grp"><h3><span class="dot" style="background:var(--prima)"></span>Prima</h3><ul id="lp"></ul></div>
    <div class="grp"><h3><span class="dot" style="background:var(--dopo)"></span>Dopo</h3><ul id="ld"></ul></div>
  </section>

  <section>
    <h2>Giorni precedenti</h2>
    <div id="hist"></div>
  </section>
</main>
<script>
(function(){
  var KEY="diario-integratori-v2";
  var DEF=["BCAA","Creatina","Arginina","Proteine in polvere"];
  var S={products:DEF.slice(),log:[]};
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.products&&p.log)S=p;}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  S.stock=S.stock||{};var when="prima",editing=false;
  var $=function(i){return document.getElementById(i)};
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  function dayKey(d){var m=d.getMonth()+1,g=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(g<10?"0":"")+g}
  var today=dayKey(new Date());
  $("date").textContent=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});

  function setWhen(w){when=w;$("bp").setAttribute("aria-pressed",w==="prima");$("bd").setAttribute("aria-pressed",w==="dopo");}
  $("bp").onclick=function(){setWhen("prima")};
  $("bd").onclick=function(){setWhen("dopo")};

  function chips(){
    var h="";
    S.products.forEach(function(n,i){
      h+='<button class="chip" data-i="'+i+'">'+esc(n)+(editing?' <span class="x" aria-label="Elimina">×</span>':"")+"</button>";
    });
    $("chips").innerHTML=h||'<p class="empty">Aggiungi il tuo primo prodotto.</p>';
    $("edit").textContent=editing?"Fatto":"Modifica prodotti";stock();
  }
  $("chips").onclick=function(e){
    var b=e.target.closest(".chip");if(!b)return;
    var i=+b.getAttribute("data-i"),n=S.products[i];
    if(editing){S.products.splice(i,1);save();chips();return;}
    var dv=$("dose").value.trim(),st=S.stock[n],u=0;
    if(st){u=parseFloat(dv.replace(",","."))||st.def||0;st.left=Math.max(0,st.left-u);}
    S.log.push({id:Date.now()+Math.random(),day:today,when:when,name:n,dose:dv,u:u});
    save();$("dose").value="";
    $("toast").textContent="Segnato: "+n+" ("+(when==="prima"?"prima":"dopo")+")";
    lists();
  };
  $("edit").onclick=function(){editing=!editing;chips()};
  function addP(){
    var v=$("newp").value.trim();if(!v)return;
    if(S.products.indexOf(v)<0)S.products.push(v);
    $("newp").value="";save();chips();
  }
  $("addp").onclick=addP;
  $("newp").onkeydown=function(e){if(e.key==="Enter")addP()};

  function item(x,del){
    return "<li><span>"+esc(x.name)+(x.dose?" <small>"+esc(x.dose)+"</small>":"")+"</span>"+(del?'<button data-id="'+x.id+'" aria-label="Elimina">×</button>':"")+"</li>";
  }
  function lists(){
    ["prima","dopo"].forEach(function(w){
      var a=S.log.filter(function(x){return x.day===today&&x.when===w});
      $(w==="prima"?"lp":"ld").innerHTML=a.length?a.map(function(x){return item(x,true)}).join(""):'<li><p class="empty">Niente ancora.</p></li>';
    });
    hist();stock();
  }
  function del(e){
    var b=e.target.closest("button[data-id]");if(!b)return;
    var id=b.getAttribute("data-id");
    var g=S.log.filter(function(x){return String(x.id)===id})[0];if(g&&g.u&&S.stock[g.name])S.stock[g.name].left+=g.u;
    S.log=S.log.filter(function(x){return String(x.id)!==id});save();lists();
  }
  $("lp").onclick=del;$("ld").onclick=del;

  function hist(){
    var days={};
    S.log.forEach(function(x){if(x.day!==today)(days[x.day]=days[x.day]||[]).push(x)});
    var keys=Object.keys(days).sort().reverse().slice(0,14);
    if(!keys.length){$("hist").innerHTML='<p class="empty">Qui vedrai i giorni passati.</p>';return;}
    $("hist").innerHTML=keys.map(function(k){
      var d=new Date(k+"T12:00:00").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
      var pr=days[k].filter(function(x){return x.when==="prima"}),dp=days[k].filter(function(x){return x.when==="dopo"});
      return "<details><summary>"+esc(d)+" <small style='color:var(--muted)'>("+days[k].length+")</small></summary>"+
        (pr.length?"<p class='hint'>Prima</p><ul>"+pr.map(function(x){return item(x,false)}).join("")+"</ul>":"")+
        (dp.length?"<p class='hint'>Dopo</p><ul>"+dp.map(function(x){return item(x,false)}).join("")+"</ul>":"")+
        "</details>";
    }).join("");
  }
  var WA="393512729899";
  function fmt(n){return String(Math.round(n*10)/10).replace(".",",")}
  function stock(){
    var sel=$("sp"),cur=sel.value;
    sel.innerHTML=S.products.map(function(n){return "<option>"+esc(n)+"</option>"}).join("");
    if(cur&&S.products.indexOf(cur)>=0)sel.value=cur;
    var h="";
    S.products.forEach(function(n){
      var st=S.stock[n];if(!st)return;
      var days=st.def>0?Math.floor(st.left/st.def):null;
      var low=st.left<=0||(days!==null&&days<=7);
      var msg="Ciao, vorrei riordinare "+n+(days!==null?" (mi restano circa "+days+" giorni)":"")+".";
      var info=st.left<=0?"Finito":"Restano "+fmt(st.left)+" g"+(days!==null?" · circa "+days+" giorni":"");
      h+='<div class="st"><div><strong>'+esc(n)+'</strong><br><small style="color:var(--muted)">'+info+'</small></div><a class="wa'+(low?" low":"")+'" href="https://wa.me/'+WA+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">Riordina su WhatsApp</a></div>';
    });
    $("stock").innerHTML=h||'<p class="empty">Nessuna scorta ancora. Aggiungila qui sotto.</p>';
  }
  $("ss").onclick=function(){
    var n=$("sp").value,q=parseFloat($("sq").value.replace(",",".")),d=parseFloat($("sd").value.replace(",","."));
    if(!n||!(q>0))return;
    S.stock[n]={left:q,def:d>0?d:0};save();$("sq").value="";$("sd").value="";stock();
  };
  chips();lists();
})();
</script>
</body>
</html>
